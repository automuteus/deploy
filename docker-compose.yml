services:
  automuteus:
    image: automuteus/automuteus:${AUTOMUTEUS_TAG:?err}
    restart: always
    environment:
      # These are required and will fail if not present
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:?err}
      - HOST=${GALACTUS_HOST:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASS=${POSTGRES_PASS:?err}

      # These Variables are optional
      - WORKER_BOT_TOKENS=${WORKER_BOT_TOKENS:-}
      - EMOJI_GUILD_ID=${EMOJI_GUILD_ID:-}
      - CAPTURE_TIMEOUT=${CAPTURE_TIMEOUT:-}
      - AUTOMUTEUS_LISTENING=${AUTOMUTEUS_LISTENING:-}
      - BASE_MAP_URL=${BASE_MAP_URL:-}
      - SLASH_COMMAND_GUILD_IDS=${SLASH_COMMAND_GUILD_IDS:-}
      - API_SERVER_URL=${API_SERVER_URL:-http://localhost:${API_PORT:-8080}}
      # Where /settings sends people: the web service below
      - WEB_URL=${WEB_URL:-http://localhost:${WEB_PORT:-3000}}
      - SHARDS=${SHARDS:-}
      - NUM_SHARDS=${NUM_SHARDS:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - LOG_LEVEL=${LOG_LEVEL:-}

      # Do **NOT** change these
      - REDIS_ADDR=${REDIS_ADDR}
      - POSTGRES_ADDR=${POSTGRES_ADDR}
    stop_grace_period: ${STOP_GRACE_PERIOD:-2m}
    depends_on:
      - redis
      - galactus
      - postgres
    volumes:
      - "bot-logs:/app/logs"

  galactus:
    image: automuteus/galactus:${GALACTUS_TAG:-${AUTOMUTEUS_TAG:?err}}
    ports:
      # See sample.env for details, but in general, match the GALACTUS_EXTERNAL_PORT w/ the GALACTUS_HOST's port
      - ${GALACTUS_EXTERNAL_PORT:-8123}:${BROKER_PORT}
    restart: always
    # On SIGTERM Galactus keeps serving for DRAIN_SECONDS while refusing new capture clients, then tells the bot to
    # end the games whose captures were connected to it (unmuting everyone) before exiting. Docker's default 10s
    # stop timeout is too short for that sequence.
    stop_grace_period: 30s
    environment:
      # Do **NOT** change these
      - BROKER_PORT=${BROKER_PORT}
      - REDIS_ADDR=${REDIS_ADDR}
      # Optional
      - DRAIN_SECONDS=${DRAIN_SECONDS:-5}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
    depends_on:
      - redis

  api:
    # API follows the bot's release tag unless explicitly overridden.
    image: automuteus/api:${API_TAG:-${AUTOMUTEUS_TAG:?err}}
    ports:
      - ${API_PORT:-8080}:${SERVICE_PORT:-5000}
    restart: always
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:?err}
      - API_PORT=${SERVICE_PORT:-5000}
      - API_SERVER_URL=${API_SERVER_URL:-http://localhost:${API_PORT:-8080}}
      - API_ADMIN_PASS=${API_ADMIN_PASS:-}
      - LOG_FORMAT=${LOG_FORMAT:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - HOST=${GALACTUS_HOST:?err}
      - POSTGRES_USER=${POSTGRES_USER:?err}
      - POSTGRES_PASS=${POSTGRES_PASS:?err}
      - POSTGRES_ADDR=${POSTGRES_ADDR}
      - REDIS_ADDR=${REDIS_ADDR}
    depends_on:
      - redis
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${API_PORT}/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  web:
    # The dashboard (https://github.com/automuteus/web) is where guild settings are managed.
    # It is versioned separately from the bot, so WEB_TAG does not follow AUTOMUTEUS_TAG.
    image: automuteus/react-web:${WEB_TAG:-latest}
    ports:
      - ${WEB_PORT:-3000}:3000
    restart: always
    environment:
      # These are required and will fail if not present; see sample.env
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?err}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:?err}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:?err}
      # Optional; the same WEB_URL the bot uses for /settings links
      - NEXTAUTH_URL=${WEB_URL:-http://localhost:${WEB_PORT:-3000}}
      # The dashboard reaches the API over the compose network; the published API_PORT is not involved.
      - AUTOMUTEUS_API_URL=http://api:${SERVICE_PORT:-5000}
      # Optional admin view of any server's stats: both must be set, and API_ADMIN_PASS must be non-default
      - ADMIN_USER_IDS=${ADMIN_USER_IDS:-}
      - API_ADMIN_PASS=${API_ADMIN_PASS:-}
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/live"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - "redis-data:/data"

  postgres:
    # Upgrading from an older major version? See "Upgrading Postgres" in README.md;
    # a newer major version cannot open an existing data volume without a migration.
    image: postgres:18-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASS}
    volumes:
      # Postgres 18+ images keep data in a version-specific directory under /var/lib/postgresql,
      # so the volume is mounted there rather than at the old /var/lib/postgresql/data.
      - "postgres-data:/var/lib/postgresql"

volumes:
  bot-logs:
  redis-data:
  postgres-data:
